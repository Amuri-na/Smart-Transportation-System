<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Smart Transportation Map Prototype</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            text-align: center;
        }

        #map {
            height: 90vh;
            width: 100%;
        }
    </style>
</head>

<body>

<h2>Smart Transportation System Prototype</h2>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([9.0320, 38.7469], 13);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

L.marker([9.0320,38.7469])
.addTo(map)
.bindPopup("Addis Ababa")
.openPopup();

if (navigator.geolocation) {

    navigator.geolocation.getCurrentPosition(
    function(position) {

        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;

        L.marker([userLat, userLng])
            .addTo(map)
            .bindPopup("Your Location")
            .openPopup();

            // Sample taxi stations

const taxiStations = [
    {
        name: "Mexico Taxi Station",
        lat: 9.0107,
        lng: 38.7613
    },
    {
        name: "Piassa Taxi Station",
        lat: 9.0358,
        lng: 38.7525
    },
    {
        name: "Bole Taxi Station",
        lat: 8.9958,
        lng: 38.7888
    }
];


taxiStations.forEach(function(station) {

    L.marker([station.lat, station.lng])
        .addTo(map)
        .bindPopup(
            "<b>" + station.name + "</b><br>Taxi Station"
        );

});

        map.setView([userLat, userLng], 15);

    },
    function(error) {
        console.log(error);
    },
    {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 0
    });


}
</script>

</body>
</html>
