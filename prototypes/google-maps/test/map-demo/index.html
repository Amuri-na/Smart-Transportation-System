<!DOCTYPE html>
<html>
<head>
    <title>Google Maps Prototype</title>

    <style>
        #map {
            height: 500px;
            width: 100%;
        }
    </style>
</head>

<body>

<h2>Smart Transportation - Google Maps Test</h2>

<div id="map"></div>

<script>
function initMap() {

    const addisAbaba = {
        lat: 9.0320,
        lng: 38.7469
    };

    const map = new google.maps.Map(
        document.getElementById("map"),
        {
            zoom: 13,
            center: addisAbaba
        }
    );
}
</script>

<script async
src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
</script>

</body>
</html>
